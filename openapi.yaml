openapi: 3.0.3
info:
  title: Geospatial Products Catalog API
  version: 1.0.0
  description: CRUD service for managing and querying geospatial products with advanced numerical and spatial filtering.
servers:
  - url: /api/v1
tags:
  - name: Products
    description: Product management and spatial search
paths:
  /products:
    post:
      tags:
        - Products
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Products
      summary: Search products
      description: Query products using implicit AND logic for all provided filters.
      operationId: searchProducts
      parameters:
        # String and Enum equality
        - name: name
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: consumption_protocol
          in: query
          schema:
            $ref: '#/components/schemas/ConsumptionProtocol'
        
        # Number filters: resolution_best
        - name: resolution_best_eq
          in: query
          schema:
            type: number
        - name: resolution_best_gt
          in: query
          schema:
            type: number
        - name: resolution_best_gte
          in: query
          schema:
            type: number
        - name: resolution_best_lt
          in: query
          schema:
            type: number
        - name: resolution_best_lte
          in: query
          schema:
            type: number

        # Integer filters: min_zoom
        - name: min_zoom_eq
          in: query
          schema:
            type: integer
        - name: min_zoom_gt
          in: query
          schema:
            type: integer
        - name: min_zoom_gte
          in: query
          schema:
            type: integer
        - name: min_zoom_lt
          in: query
          schema:
            type: integer
        - name: min_zoom_lte
          in: query
          schema:
            type: integer

        # Integer filters: max_zoom
        - name: max_zoom_eq
          in: query
          schema:
            type: integer
        - name: max_zoom_gt
          in: query
          schema:
            type: integer
        - name: max_zoom_gte
          in: query
          schema:
            type: integer
        - name: max_zoom_lt
          in: query
          schema:
            type: integer
        - name: max_zoom_lte
          in: query
          schema:
            type: integer

        # Spatial filters (Expects EPSG:4326 WKT string)
        - name: intersects
          in: query
          description: Returns products whose bounding polygon intersects with the provided WKT geometry.
          schema:
            type: string
            example: "POLYGON((34.0 32.0, 35.0 32.0, 35.0 33.0, 34.0 33.0, 34.0 32.0))"
        - name: contains
          in: query
          description: Returns products whose bounding polygon completely contains the provided WKT geometry.
          schema:
            type: string
            example: "POINT(34.75 32.05)"
        - name: within
          in: query
          description: Returns products whose bounding polygon is completely within the provided WKT geometry.
          schema:
            type: string
            example: "POLYGON((34.0 31.0, 36.0 31.0, 36.0 34.0, 34.0 34.0, 34.0 31.0))"
      responses:
        '200':
          description: A list of products matching the criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: A query parameter failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Products
      summary: Get a product by ID
      operationId: getProductById
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Products
      summary: Update an existing product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Products
      summary: Delete a product
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted successfully
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
    ProductType:
      type: string
      enum:
        - raster
        - rasterized vector
        - 3d tiles
        - QMesh
    ConsumptionProtocol:
      type: string
      enum:
        - WMS
        - WMTS
        - XYZ
        - 3D Tiles
    GeoJSONPolygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
    ProductCreate:
      type: object
      required:
        - name
        - type
        - consumption_protocol
      properties:
        name:
          type: string
          maxLength: 48
        description:
          type: string
        bounding_polygon:
          $ref: '#/components/schemas/GeoJSONPolygon'
        consumption_link:
          type: string
        type:
          $ref: '#/components/schemas/ProductType'
        consumption_protocol:
          $ref: '#/components/schemas/ConsumptionProtocol'
        resolution_best:
          type: number
          format: double
        min_zoom:
          type: integer
        max_zoom:
          type: integer
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductCreate'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid