replicaCount: 1

image:
  repository: acrarolibotnonprod.azurecr.io/test-catalog
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Plain pass-through env vars — as generic/free-form as a Deployment's own `env`.
#
# The DB password is no longer a plaintext value here — it's read live from the
# `helm/postgresql` release's own Secret (test-catalog-db-postgresql, key
# postgres-password), so there's nothing to keep in sync by hand anymore.
# (A bare `envFrom: [{secretRef: {name: test-catalog-db-postgresql}}]` would
# dump that secret's keys in verbatim as `postgres-password` etc. — not a name
# this app reads — so the password is pulled in as its own named `env` entry
# via secretKeyRef instead, same idea, just renamed to something DB_PASSWORD.)
#
# CONFIG_OFFLINE_MODE is required: @map-colonies/config defaults to fetching from
# a config-server, which isn't deployed here — offline mode makes it validate
# config/default.json (baked into the image) plus these env vars instead.
env:
  - name: NODE_ENV
    value: production
  - name: CONFIG_OFFLINE_MODE
    value: "true"
  - name: DB_HOST
    value: test-catalog-db-postgresql
  - name: DB_PORT
    value: "5432"
  - name: DB_USER
    value: postgres
  - name: DB_NAME
    value: spatial_db
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: test-catalog-db-postgresql
        key: postgres-password

# Same idea, for envFrom (whole ConfigMaps/Secrets at once) — nothing needed
# here for the DB (see above), but left available for anything else.
# envFrom:
#   - secretRef:
#       name: my-secret
envFrom: []

probes:
  path: /liveness
  port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# HPA needs these to compute utilization %, so they're set by default rather
# than left empty (an HPA against a container with no resource requests just
# silently never scales).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # Leave empty to scale on CPU only.
  targetMemoryUtilizationPercentage: ""

# Plain Kubernetes Ingress. Leave disabled and use `route` instead on OpenShift.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: api-tls
  #     hosts:
  #       - api.example.local

# OpenShift Route, as an alternative to `ingress` on clusters that don't run
# an Ingress controller. Enable at most one of the two.
route:
  enabled: true
  host: ""
  annotations: {}
  tls:
    termination: edge

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
