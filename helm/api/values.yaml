replicaCount: 1

image:
  repository: acrarolibotnonprod.azurecr.io/test-catalog
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  - name: NODE_ENV
    value: production
  - name: CONFIG_OFFLINE_MODE
    value: "true"

# Same idea, for envFrom (whole ConfigMaps/Secrets at once) — nothing needed
# here for the DB (see above), but left available for anything else.
# envFrom:
#   - secretRef:
#       name: my-secret
envFrom: []

volumes: []
volumeMounts: []

probes:
  path: /liveness
  port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []


route:
  enabled: true
  host: ""
  annotations: {}
  tls:
    termination: edge

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
